[workspace]
resolver = "3"
members = ["client", "server"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "net"] }
livekit = "0.10.1"
livekit-api = "0.10.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4"
egui = {version = "0.37.0", features = ["default"]}
eframe = "0.37.0"
